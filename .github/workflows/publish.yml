name: Publish to crates.io
on:
  push:
    tags: ['v*']  # Triggers when pushing tags starting with 'v'
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release  # Optional: for enhanced security
    permissions:
      id-token: write     # Required for OIDC token exchange
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
        
      - name: Check if version is already published
        id: check_version
        run: |
          set +e
          ./scripts/is_version_already_uploaded.sh match_opt
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 7 ]; then
            echo "Version already published"
            echo "already_published=true" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "Version is new"
            echo "already_published=false" >> $GITHUB_OUTPUT
          else
            echo "Unexpected error from version check script"
            exit $EXIT_CODE
          fi
          
      - name: Run tests
        if: steps.check_version.outputs.already_published == 'false'
        run: cargo test
        
      - name: Check formatting
        if: steps.check_version.outputs.already_published == 'false'
        run: cargo fmt --check
        
      - name: Run clippy
        if: steps.check_version.outputs.already_published == 'false'
        run: cargo clippy -- -D warnings
        
      - name: Verify package
        if: steps.check_version.outputs.already_published == 'false'
        run: cargo package --dry-run
        
      - name: Get OIDC token for publishing
        if: steps.check_version.outputs.already_published == 'false'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
        
      - name: Publish to crates.io
        if: steps.check_version.outputs.already_published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}